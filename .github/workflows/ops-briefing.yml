name: Capture FEMA Daily Ops Briefing

on:
  schedule:
    # 13:45 UTC = 9:45am ET (EDT) / 8:45am ET (EST).
    # FEMA publishes the briefing around 8:30am ET, so this gives a
    # comfortable buffer for the email and kill-the-newsletter feed
    # to update before the job runs.
    - cron: "45 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch briefing
        env:
          KTN_FEED_URL: ${{ secrets.KTN_FEED_URL }}
          DD_OUT: archive
        run: python scripts/fetch_ops_briefing.py

      - name: Commit new briefing(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ops-briefings
          if git diff --cached --quiet; then
            echo "No new briefings to commit."
          else
            git commit -m "Archive FEMA Daily Ops Briefing"
            git push
          fi
