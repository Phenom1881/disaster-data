name: Refresh Plus State Data

on:
  schedule:
    # Weekly, Sunday 06:00 UTC - after the main "Refresh FEMA Data" run
    # (04:00 UTC) so Plus's federal cross-references see fresh data too.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # One job per state. max-parallel: 1 means they run one after another,
  # not simultaneously - this is deliberate, not a performance limitation:
  # each job commits its own state's scraped files directly to main, and
  # running them sequentially avoids every job racing to push at once
  # (the exact kind of git conflict hit manually earlier this project).
  # fail-fast: false means one state's scraper failing does NOT cancel
  # the remaining states - each is fully isolated from the others, which
  # is the actual goal here, achieved without needing separate files.
  #
  # To add a new state later: add one entry to the matrix list below.
  # No new workflow file, no duplicated boilerplate to keep in sync.
  # ------------------------------------------------------------------
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        state:
          - name: pennsylvania
            prefix: pa
            script: pa_eo_scraper.py
          - name: new-jersey
            prefix: nj
            script: nj_eo_scraper.py
          # NOT YET CONFIRMED - fill in the real script filename and
          # prefix for each of these, then uncomment. A wrong guess here
          # would fail this one state's job (visibly, in its own isolated
          # log) without affecting the other four - that isolation is
          # exactly why it's safe to add these incrementally rather than
          # needing all 5 confirmed before this workflow can be used.
          # - name: virginia
          #   prefix: va
          #   script: <SCRAPER_FILENAME>.py
          # - name: new-york
          #   prefix: ny
          #   script: <SCRAPER_FILENAME>.py
          # - name: north-carolina
          #   prefix: nc
          #   script: <SCRAPER_FILENAME>.py

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 lxml pdfplumber

      - name: Scrape ${{ matrix.state.name }}
        run: |
          python plus/${{ matrix.state.name }}/${{ matrix.state.script }} \
            --actions-out plus/${{ matrix.state.name }}/${{ matrix.state.prefix }}_emergency_actions_all.csv \
            --relationships-out plus/${{ matrix.state.name }}/${{ matrix.state.prefix }}_order_relationships.csv \
            --join-out plus/${{ matrix.state.name }}/declarations_for_join.csv

      - name: Commit ${{ matrix.state.name }}'s scraped data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "plus/${{ matrix.state.name }}/"
          if git diff --staged --quiet; then
            echo "No changes for ${{ matrix.state.name }}."
          else
            git commit -m "Auto-refresh ${{ matrix.state.name }} scraped data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

  # ------------------------------------------------------------------
  # Runs once, after every state's scrape job has finished (successfully
  # or not - "if: always()" ensures a single state's scraper failure
  # doesn't skip building/publishing the states that did succeed). Pulls
  # whatever's on main at this point (each state's own commit, if it
  # made one) and runs the actual cross-state join/match/page build.
  # ------------------------------------------------------------------
  join-and-build:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run storm join for all Plus states
        id: join
        run: |
          set -o pipefail
          python scripts/build-plus.py --states all --join-storms 2>&1 | tee plus_build.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check for newly-ambiguous declarations
        id: ambiguous_check
        run: |
          if grep -q "had no recognized hazard keyword" plus_build.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            grep -B1 "had no recognized hazard keyword" plus_build.log > ambiguous_summary.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue for new ambiguous declarations
        if: steps.ambiguous_check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('ambiguous_summary.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Plus refresh: new ambiguous declaration(s) need a hazard_overrides.csv review - ${new Date().toISOString().slice(0,10)}`,
              body: "The weekly Plus refresh found declaration(s) that didn't match any hazard keyword and were skipped (not a bug - this is the intended fail-closed behavior). Each one below likely needs a manual review and a row added to that state's `hazard_overrides.csv`.\n\n```\n" + summary + "\n```\n\nSee the run log for full detail: " + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail the run if any state's storm join failed
        if: steps.join.outputs.exit_code != '0'
        run: |
          echo "One or more Plus states failed their storm join - see the log above. Not committing partial/stale results."
          exit 1

      - name: Commit built pages and matches if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- plus/
          if git diff --staged --quiet; then
            echo "No changes to commit from the join/build step."
          else
            git commit -m "Auto-refresh Plus matches and pages $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
