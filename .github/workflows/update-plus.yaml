name: Refresh Plus State Data

on:
  schedule:
    # Weekly, Sunday 06:00 UTC - after the main "Refresh FEMA Data" run
    # (04:00 UTC) so Plus's federal cross-references see fresh data too.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  # This replaces a per-state build matrix that had gone badly stale.
  #
  # That matrix listed only pennsylvania and new-jersey, with three more
  # states commented out as placeholders, so 48 of the 50 implemented
  # states never had their source archives re-scraped: only the join and
  # page build below ran for them, against declaration data that was
  # frozen at whatever was last committed by hand.
  #
  # It could not simply be extended to 50 entries either. Each matrix job
  # invoked the state's scraper directly with a hardcoded
  # --actions-out/--relationships-out/--join-out flag set, and only 41 of
  # the 50 scrapers accept those flags. Virginia alone runs two scrapers
  # and merges them. The per-state calling convention lives in each
  # state's own wrapper, in its collect() function, which is exactly what
  # build-plus.py's --collect flag already loads and calls.
  #
  # So the matrix is gone. One step now collects every state through its
  # own adapter contract. Adding a state later needs no change here at
  # all: it is picked up from scripts/plus/state-manifest.json.
  #
  # Failure isolation is preserved. build-plus.py catches an individual
  # adapter's collect() failure, prints a WARNING for that state and
  # continues with the rest, rather than aborting the run.
  # ------------------------------------------------------------------
  refresh-plus:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 lxml pdfplumber

      - name: Collect state archives and run the storm join
        run: |
          set -o pipefail
          python -u scripts/build-plus.py \
            --states all --collect --join-storms 2>&1 | tee plus_build.log

      # Ambiguous declarations are not errors. The classifier is
      # fail-closed by design: a declaration whose text matches no hazard
      # keyword is skipped rather than guessed at. But each one is a real
      # record that needs a human decision and a hazard_overrides.csv row,
      # so surface them instead of letting them sit silently in a log.
      - name: Check for newly ambiguous declarations
        id: ambiguous_check
        run: |
          if grep -q "had no recognized hazard keyword" plus_build.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            grep -B1 "had no recognized hazard keyword" plus_build.log \
              > ambiguous_summary.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue for new ambiguous declarations
        if: steps.ambiguous_check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('ambiguous_summary.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Plus refresh: new ambiguous declaration(s) need a hazard_overrides.csv review - ${new Date().toISOString().slice(0,10)}`,
              body: "The weekly Plus refresh found declaration(s) that didn't match any hazard keyword and were skipped (not a bug - this is the intended fail-closed behavior). Each one below likely needs a manual review and a row added to that state's `hazard_overrides.csv`.\n\n```\n" + summary + "\n```\n\nSee the run log for full detail: " + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      # Commit the scraped source data and Plus pages on their own, before
      # the main-site regeneration below. A week of fresh state archive
      # data is worth keeping even if a downstream site check later fails.
      - name: Commit Plus data and pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- plus/
          if git diff --staged --quiet; then
            echo "No Plus changes to commit."
          else
            git commit -m "Auto-refresh Plus state data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      # This workflow runs AFTER the main build (04:00 vs 06:00), because
      # the Plus join wants fresh federal data. The consequence is that the
      # jurisdiction pages built at 04:00 carried last week's Plus data.
      # Rebuilding the sidecar and the jurisdiction pages here closes that
      # gap, so a locality page reflects state declarations collected in
      # the same run rather than trailing them by a week.
      - name: Rebuild state declaration sidecar
        run: python -u gen_plus_sidecar.py

      - name: Regenerate jurisdiction pages
        run: python -u gen-jurisdiction-pages.py

      - name: Validate and stamp release
        run: python -u .github/workflows/release.py

      - name: Commit regenerated site pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Rebuild jurisdiction pages with refreshed Plus data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
