name: Refresh Plus State Data

on:
  schedule:
    # Weekly, Sunday 06:00 UTC - after the main "Refresh FEMA Data" run
    # (04:00 UTC) so Plus's federal cross-references see fresh data too.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One Plus refresh at a time. On 2026-09-27 the weekly scheduled run (which
# GitHub fires hours late, around 11:00 UTC) started four minutes after a
# manual run; the scheduled one pushed first, and the manual one failed at
# its commit after 48 minutes because the same files had changed under it.
# The same happened on 2026-09-12. A run that starts while another is going
# now waits for it, then refreshes on top of its results.
concurrency:
  group: refresh-plus-state-data
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # This replaces a per-state build matrix that had gone badly stale.
  #
  # That matrix listed only pennsylvania and new-jersey, with three more
  # states commented out as placeholders, so 48 of the 50 implemented
  # states never had their source archives re-scraped: only the join and
  # page build below ran for them, against declaration data that was
  # frozen at whatever was last committed by hand.
  #
  # It could not simply be extended to 50 entries either. Each matrix job
  # invoked the state's scraper directly with a hardcoded
  # --actions-out/--relationships-out/--join-out flag set, and only 41 of
  # the 50 scrapers accept those flags. Virginia alone runs two scrapers
  # and merges them. The per-state calling convention lives in each
  # state's own wrapper, in its collect() function, which is exactly what
  # build-plus.py's --collect flag already loads and calls.
  #
  # So the matrix is gone. One step now collects every state through its
  # own adapter contract. Adding a state later needs no change here at
  # all: it is picked up from scripts/plus/state-manifest.json.
  #
  # Failure isolation is preserved. build-plus.py catches an individual
  # adapter's collect() failure, prints a WARNING for that state and
  # continues with the rest, rather than aborting the run.
  # ------------------------------------------------------------------
  refresh-plus:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 lxml pdfplumber pypdf

      # Oregon posts its orders as scanned images with no text layer, so the
      # signing date can only be read with OCR (tesseract). If this install
      # fails the refresh still runs; Oregon's undated orders wait for a
      # later run.
      - name: Install OCR for scanned orders
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Collect state archives and run the storm join
        run: |
          set -o pipefail
          python -u scripts/build-plus.py \
            --states all --collect --join-storms 2>&1 | tee plus_build.log

      # Ambiguous declarations are not errors. The classifier is
      # fail-closed by design: a declaration whose text matches no hazard
      # keyword is skipped rather than guessed at. But each one is a real
      # record that needs a human decision and a hazard_overrides.csv row,
      # so surface them instead of letting them sit silently in a log.
      - name: Check for newly ambiguous declarations
        id: ambiguous_check
        run: |
          if grep -q "had no recognized hazard keyword" plus_build.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            grep -B1 "had no recognized hazard keyword" plus_build.log \
              > ambiguous_summary.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Backstop for the keep-saved safeguard in build-plus.py: compare every
      # protected state file with the last commit and put back any saved row
      # this refresh dropped. It restores rather than fails, and its lines go
      # into plus_build.log so each repair is on record.
      - name: Put back any saved rows the refresh dropped
        run: python -u scripts/check_plus_row_loss.py 2>&1 | tee -a plus_build.log

      # Grades every state green, yellow or red with the reason, so a state
      # that stops working shows up the same week instead of whenever someone
      # happens to look at it. Writes plus/_health/ (committed below with the
      # Plus data) and the text for the health issue. Runs even when the
      # collection step failed, since that is when the report matters most.
      - name: Check the health of every state
        if: ${{ !cancelled() }}
        run: |
          python -u scripts/plus_health.py \
            --issue-body-out "$RUNNER_TEMP/plus_health_issue.md" \
            --changes-out "$RUNNER_TEMP/plus_health_changes.md" 2>&1 | tee -a plus_build.log

      # Commit the scraped source data and Plus pages on their own, before
      # the main-site regeneration below. A week of fresh state archive
      # data is worth keeping even if a downstream site check later fails.
      - name: Commit Plus data and pages if changed
        id: commit_plus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No Plus changes to commit."
          else
            git commit -m "Auto-refresh Plus state data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

      # Both issues are updated after the Plus data commit, so they always
      # describe what was committed. A run whose commit failed leaves them
      # alone; on 2026-09-27 the failed run overwrote the health report with
      # results that were never saved. The health issue still updates when
      # collection itself failed, since that is when the report matters most.

      # One issue, kept current. It used to open a new issue every run, even
      # when the list had not changed, which left seven copies open by
      # 2026-09-26. Now the newest open one is updated with this run's list,
      # older copies are closed, and the issue closes itself once nothing is
      # left to review.
      - name: Keep one issue for declarations that need a hazard review
        uses: actions/github-script@v7
        env:
          FOUND: ${{ steps.ambiguous_check.outputs.found }}
        with:
          script: |
            const fs = require('fs');
            const prefixes = ['Plus refresh: new ambiguous declaration', 'Plus refresh: declarations that need a hazard review'];
            const title = 'Plus refresh: declarations that need a hazard review';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            })).filter(i => !i.pull_request && prefixes.some(p => i.title.startsWith(p)))
               .sort((a, b) => b.number - a.number);
            const found = process.env.FOUND === 'true' && fs.existsSync('ambiguous_summary.txt');
            const today = new Date().toISOString().slice(0, 10);
            if (!found) {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body: `The ${today} refresh found nothing left to review. Closing. ${runUrl}` });
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const summary = fs.readFileSync('ambiguous_summary.txt', 'utf8');
            const body = `Last checked ${today}. These declarations matched no hazard keyword, so no storm search was made for them. This is the intended fail-closed behavior, not a bug. Each needs a row in that state's \`hazard_overrides.csv\`: a hazard category (with \`event_date\` if the order was signed well after the event), or \`exclude\` if it is not weather. Once a declaration has a row it drops off this list.\n\n\`\`\`\n${summary}\n\`\`\`\n\nRun log: ${runUrl}`;
            if (open.length === 0) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              return;
            }
            const [keep, ...older] = open;
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
              issue_number: keep.number, title, body });
            for (const issue of older) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `Superseded by #${keep.number}, which now holds the current list.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed' });
            }

      # One standing issue holds the current report. The body is replaced
      # every run; a comment is added only when a state changes grade, so a
      # notification means something changed.
      - name: Keep the Plus health issue current
        if: ${{ !cancelled() && steps.commit_plus.outcome != 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;
            const bodyPath = `${temp}/plus_health_issue.md`;
            if (!fs.existsSync(bodyPath)) {
              core.warning('The health check did not write a report.');
              return;
            }
            const body = fs.readFileSync(bodyPath, 'utf8');
            const changesPath = `${temp}/plus_health_changes.md`;
            const changes = fs.existsSync(changesPath) ? fs.readFileSync(changesPath, 'utf8').trim() : '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Plus health report';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).filter(i => !i.pull_request && i.title === title)
               .sort((a, b) => b.number - a.number);
            let number;
            if (open.length === 0) {
              number = (await github.rest.issues.create({ owner, repo, title, body })).data.number;
            } else {
              number = open[0].number;
              await github.rest.issues.update({ owner, repo, issue_number: number, body });
              for (const extra of open.slice(1)) {
                await github.rest.issues.createComment({ owner, repo, issue_number: extra.number,
                  body: `Superseded by #${number}.` });
                await github.rest.issues.update({ owner, repo, issue_number: extra.number, state: 'closed' });
              }
            }
            if (changes) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number,
                body: `${changes}\n\nRun: ${runUrl}` });
            }

      # This workflow runs AFTER the main build (04:00 vs 06:00), because
      # the Plus join wants fresh federal data. The consequence is that the
      # jurisdiction pages built at 04:00 carried last week's Plus data.
      # Rebuilding the sidecar and the jurisdiction pages here closes that
      # gap, so a locality page reflects state declarations collected in
      # the same run rather than trailing them by a week.
      - name: Rebuild state declaration sidecar
        run: python -u gen_plus_sidecar.py

      - name: Regenerate jurisdiction pages
        run: python -u gen-jurisdiction-pages.py

      - name: Validate and stamp release
        run: python -u .github/workflows/release.py

      - name: Commit regenerated site pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Rebuild jurisdiction pages with refreshed Plus data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
