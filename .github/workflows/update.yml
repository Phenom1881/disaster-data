name: Refresh FEMA Data

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Build data.js
        run: python -u build.py

      - name: Generate state SEO pages
        run: python -u gen_state_pages.py

      - name: Generate jurisdiction pages
        run: python -u gen_jurisdiction_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js map-data.js index.html sitemap.xml robots.txt locality-index.js states/
          if git diff --staged --quiet; then
            echo "No changes to commit, data is already up to date."
          else
            git commit -m "Auto-refresh FEMA data $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
