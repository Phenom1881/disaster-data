name: Refresh Event Indexes

# Rebuilds map-events.js + events.json from the ALREADY-COMMITTED
# data/decl-index files.
#
# It does NOT fetch anything from FEMA, so it can operate as a Wednesday
# backstop even if the Sunday OpenFEMA refresh encountered an upstream outage.
#
# The release gate runs after the event indexes are generated. If the event
# files are unchanged, the existing DisasterData release remains in place.
# If they changed, the complete site is validated before a new release is
# stamped and committed.

on:
  workflow_dispatch:

  schedule:
    - cron: '0 4 * * 3'

permissions:
  contents: write

# Prevent a manually launched event refresh from writing to main at the same
# time as the full Sunday DisasterData refresh.
concurrency:
  group: disasterdata-refresh
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build event indexes
        run: |
          if [ -f gen_map_events.py ]; then
            python -u gen_map_events.py \
              --in data/decl-index \
              --out map-events.js \
              --events-out events.json
          else
            python -u "gen map events.py" \
              --in data/decl-index \
              --out map-events.js \
              --events-out events.json
          fi

      - name: Validate and stamp DisasterData release
        env:
          DD_REQUIRE_CONTEXT: '1'
          DD_REQUIRE_JURISDICTIONS: '1'
          DD_REQUIRE_CITATIONS: '1'
        run: python -u release.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit. Event indexes and release state are already current."
          else
            git commit -m "Refresh event indexes $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
