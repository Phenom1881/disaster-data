name: Refresh Event Indexes

# Rebuilds map-events.js + events.json from the ALREADY-COMMITTED
# data/decl-index files. It does NOT fetch anything from FEMA, so it works
# even when the weekly "Refresh FEMA Data" build is failing on an OpenFEMA
# outage. Run it on demand from the Actions tab (Run workflow), or let the
# weekly backstop pick up whatever decl-index is committed.

on:
  workflow_dispatch:

  schedule:
    - cron: '0 4 * * 3'

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build event indexes (map-events.js + events.json)
        run: |
          if [ -f gen_map_events.py ]; then
            python -u gen_map_events.py \
              --in data/decl-index \
              --out map-events.js \
              --events-out events.json
          else
            python -u "gen map events.py" \
              --in data/decl-index \
              --out map-events.js \
              --events-out events.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit, event indexes already up to date."
          else
            git commit -m "Refresh event indexes $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
