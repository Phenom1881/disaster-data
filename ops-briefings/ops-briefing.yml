name: Capture FEMA Daily Ops Briefing

on:
  schedule:
    # 13:45 UTC = 9:45am ET (EDT) / 8:45am ET (EST).
    # FEMA publishes the briefing around 8:30am ET; this gives the
    # Disaster Center mirror time to update before the job runs.
    - cron: "45 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Fetch briefing
        env:
          DD_OUT: archive
        run: |
          FETCH=$(find scripts -iname 'fetch*ops*brief*.py' | head -n1)
          echo "Using fetch script: $FETCH"
          python "$FETCH"

      - name: Build ops briefing pages
        env:
          DD_OUT: archive
        run: |
          BUILD=$(find scripts -iname 'build*ops*pages*.py' | head -n1)
          echo "Using build script: $BUILD"
          python "$BUILD"

      - name: Commit new briefing(s) and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ops-briefings ops-briefings
          if git diff --cached --quiet; then
            echo "No new briefings to commit."
          else
            git commit -m "Archive FEMA Daily Ops Briefing"
            git push
          fi
