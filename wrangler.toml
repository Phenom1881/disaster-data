name = "disasterdata-api"
main = "worker-api.js"
compatibility_date = "2026-01-01"

# Live at https://disasterdata-api.disasterdata.workers.dev (first deployed
# 2026-10-05). disasterdata.io is not a zone in this Cloudflare account, so
# a Custom Domain cannot attach yet ("Can't infer zone from route", code
# 10082). Once the zone is added to this account, add the line below and
# redeploy; the workers.dev address keeps working alongside it. A Custom
# Domain takes a bare hostname: no path and no "/*".
# routes = [ { pattern = "api.disasterdata.io", custom_domain = true } ]
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Native Cloudflare rate limiting, checked in worker-api.js before any real
# work runs. 60 requests per 60 seconds per client IP: change the numbers
# here, no code change.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
